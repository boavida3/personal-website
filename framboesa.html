<h1>Framboesa</h1>

<p>Framboesa shows upcoming Google Calendar events on a 7.3" Pimoroni Inky
Impression e-ink display attached to a Raspberry Pi.</p>

<p>Each calendar gets its own color, so several people's schedules can share
one screen. The display only refreshes when the events change.</p>
